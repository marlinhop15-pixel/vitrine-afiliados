<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Vitrine | Ofertas e Produtos</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  background:#1e293b;
  padding:25px 16px;
  text-align:center;
}

header h1{
  margin:0;
  color:#f97316;
  font-size:30px;
}

header p{
  color:#cbd5e1;
  margin-bottom:0;
}

main{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.pesquisa{
  width:100%;
  padding:15px;
  border-radius:10px;
  border:1px solid #475569;
  background:#1e293b;
  color:white;
  font-size:16px;
  margin-bottom:18px;
}

.grupo{
  margin-bottom:20px;
}

.grupo h3{
  color:#f97316;
  margin-bottom:10px;
}

.botoes{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.botoes button{
  padding:10px 14px;
  border:1px solid #475569;
  border-radius:20px;
  background:#1e293b;
  color:white;
  cursor:pointer;
}

.botoes button.ativo{
  background:#f97316;
  border-color:#f97316;
}

#contador{
  color:#cbd5e1;
  margin:20px 0;
}

#produtos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
}

.produto{
  background:#1e293b;
  border:1px solid #334155;
  border-radius:13px;
  padding:13px;
  display:flex;
  flex-direction:column;
}

.produto-imagem{
  width:100%;
  height:190px;
  object-fit:contain;
  background:white;
  border-radius:9px;
}

.sem-imagem{
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#334155;
  border-radius:9px;
  font-size:45px;
}

.produto h3{
  font-size:17px;
  line-height:1.4;
}

.produto p{
  color:#cbd5e1;
  line-height:1.5;
}

.preco{
  color:#4ade80;
  font-size:22px;
  font-weight:bold;
}

.preco-anterior{
  color:#94a3b8;
  text-decoration:line-through;
}

.loja{
  color:#fbbf24;
  font-size:13px;
}

.botao-oferta{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#f97316;
  color:white;
  padding:13px;
  border-radius:8px;
  font-weight:bold;
  margin-top:auto;
}

.mensagem{
  grid-column:1/-1;
  text-align:center;
  padding:30px;
  background:#1e293b;
  border-radius:12px;
  color:#cbd5e1;
}

footer{
  margin-top:35px;
  padding:22px;
  text-align:center;
  background:#1e293b;
  color:#94a3b8;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🛍️ Minha Vitrine</h1>
  <p>Encontre ofertas e produtos selecionados</p>
</header>

<main>

  <input
    type="search"
    id="pesquisa"
    class="pesquisa"
    placeholder="🔎 Pesquisar produtos..."
  >

  <div class="grupo">
    <h3>Lojas</h3>
    <div class="botoes">
      <button class="filtro ativo" data-loja="todos">Todas</button>
      <button class="filtro" data-loja="Mercado Livre">Mercado Livre</button>
      <button class="filtro" data-loja="Amazon">Amazon</button>
      <button class="filtro" data-loja="Shopee">Shopee</button>
      <button class="filtro" data-loja="Outra">Outras</button>
    </div>
  </div>

  <div class="grupo">
    <h3>Categorias</h3>
    <div class="botoes">
      <button class="categoria ativo" data-categoria="todos">Todas</button>
      <button class="categoria" data-categoria="Eletrônicos">Eletrônicos</button>
      <button class="categoria" data-categoria="Casa">Casa</button>
      <button class="categoria" data-categoria="Beleza">Beleza</button>
      <button class="categoria" data-categoria="Ferramentas">Ferramentas</button>
    </div>
  </div>

  <div id="contador">Carregando produtos...</div>

  <section id="produtos">
    Carregando produtos...
  </section>

</main>

<footer>
  <p>Minha Vitrine</p>
  <p>Alguns links são links de afiliados. Podemos receber uma comissão por compras realizadas, sem custo adicional para você.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>

</body>
</html>
