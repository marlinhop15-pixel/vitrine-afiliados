
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Confira nossas melhores ofertas!">
  <title>Minha Vitrine de Ofertas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <header class="header">
      <div class="logo">🛍️</div>
      <h1>MINHA VITRINE</h1>
      <p>Ofertas selecionadas para você!</p>
    </header>

    <section class="banner">
      <h2>Encontre sua próxima compra!</h2>
      <p>Confira nossos produtos e aproveite as ofertas.</p>
    </section>

    <section class="filtros">
      <button class="filtro ativo" data-loja="todos">Todos</button>
      <button class="filtro" data-loja="shopee">Shopee</button>
      <button class="filtro" data-loja="mercadolivre">
        Mercado Livre
      </button>
    </section>

    <section id="produtos" class="produtos"></section>

    <footer>
      <p>Alguns links podem gerar comissão sem custo adicional.</p>
      <p>© 2026 Minha Vitrine</p>
    </footer>

  </main>

  <script src="script.js"></script>

</body>
                            </html>
